workflowVersion: 1.0.0
speakeasyVersion: latest
sources:
    PermitStack:
        inputs:
            - location: https://api.permit-stack.com/public-openapi.json
        output: .speakeasy/out.openapi.yaml
        registry:
            location: registry.speakeasyapi.dev/permitstack/openapi/permit-stack
targets:
    permitstack:
        target: python
        source: PermitStack
        codeSamples:
            registry:
                location: registry.speakeasyapi.dev/permitstack/openapi/permit-stack-python-code-samples
            labelOverride:
                fixedValue: Python (SDK)
            blocking: false
