rDetail"},"example":{"detail":"Rate limit exceeded: 30 requests per minute"}}}}}}},"/v1/webhooks/{webhook_id}/rotate-secret":{"post":{"tags":["Webhooks"],"summary":"Rotate Webhook Secret","description":"Issue a NEW signing secret for this webhook. The old one stops working immediately.\n\nEvery delivery after this call is signed with the new secret, so update your verifier\nfirst. Creating a webhook again with the same settings returns the existing secret; this\nendpoint is the only way to rotate it.","operationId":"rotate_webhook_secret","security":[{"ApiKey":[]}],"parameters":[{"name":"webhook_id","in":"path","required":true,"schema":{"type":"string","title":"Webhook Id"}}],"responses":{"200":{"description":"Successful Response","content":{"application/json":{"schema":{}}}},"422":{"description":"Validation Error","content":{"application/json":{"schema":{"$ref":"#/components/schemas/HTTPValidationError"}}}},"401":{"description":"Missing or invalid API key. Pass a key as the `X-API-Key` header.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorDetail"},"example":{"detail":"Invalid API key"}}}},"429":{"description":"Rate limit exceeded -- either the per-minute burst or the daily cap for your plan. Retry after the window resets; the daily cap resets at UTC midnight.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorDetail"},"example":{"detail":"Rate limit exceeded: 30 requests per minute"}}}}}}},"/v1/webhooks/{webhook_id}/secret":{"get":{"tags":["Webhooks"],"summary":"Get Webhook Secret","description":"Retrieve your webhook signing secret. Use this to validate signatures.\n\nThe X-PermitStack-Signature header on incoming webhook requests is the\nHMAC-SHA256 of the request body using this secret. Verify before \nprocessing to ensure the request came from PermitStack.","operationId":"get_webhook_secret","security":[{"ApiKey":[]}],"parameters":[{"name":"webhook_id","in":"path","required":true,"schema":{"type":"string","