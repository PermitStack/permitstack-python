,"jurisdiction_name":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Jurisdiction Name","description":"The PermitStack data source this permit came from -- a city, county or statewide feed, which is not always the permit's own city.","examples":["Daytona Beach"]},"latitude":{"anyOf":[{"type":"number"},{"type":"null"}],"title":"Latitude","description":"WGS84 latitude. Null where the source publishes no coordinates and we could not geocode it; such permits are invisible to radius, bbox and polygon search.","examples":[29.1872]},"longitude":{"anyOf":[{"type":"number"},{"type":"null"}],"title":"Longitude","description":"WGS84 longitude.","examples":[-81.0559]},"location_source":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Location Source","description":"Where the coordinates came from. 'source' = published by the city with the permit record, as good as the city's own data. 'geocoded' = derived by us from the site address (TIGER, address-centroid quality), which for a structure set back from the road, such as an antenna mast, marks the property address rather than the structure. 'derived' = set by us by another method (typically a parcel-centroid join), so treat it as ours, not the city's. 'source' is judged per feed: in a feed that publishes coordinates, a minority of rows whose record lacked them may have been filled by our geocoder before 2026-09-21, when it began logging successes, and those read 'source'. Null when latitude/longitude are null.","examples":["source"]},"enrichment":{"anyOf":[{"$ref":"#/components/schemas/PermitEnrichment"},{"type":"null"}],"description":"Structured detail parsed from the description (e.g. solar kW) where we could extract it. Null for most permits."}},"type":"object","required":["id","permit_number","status","category","tags","property_type","address_street","address_city","address_state","address_zip","description_raw","estimated_value","date_filed","date_issued","date_completed"],"title":"PermitSummary","description":"