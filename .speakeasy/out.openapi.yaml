,"OTHER"],"title":"Category","description":"Trade/work classification, UPPERCASE. One of: NEW_CONSTRUCTION, RENOVATION, DEMOLITION, ELECTRICAL, PLUMBING, MECHANICAL, ROOFING, SOLAR, BATTERY, EV_CHARGER, HVAC, FIRE_ALARM, SIGN, FENCE, POOL, FOUNDATION, ADDITION, INTERIOR_REMODEL, GRADING, OTHER. Derived by us from the permit type and description, not published by the city. NOTE when FILTERING: ?category=hvac matches HVAC *and* MECHANICAL, and ?category=mechanical does the same, because HVAC work is routinely filed as MECHANICAL -- they are one market and a bare equality would hide half of it.","examples":["ROOFING"]},"tags":{"anyOf":[{"items":{"type":"string"},"type":"array"},{"type":"null"}],"title":"Tags","description":"Free-form keywords extracted from the description (e.g. 'pool', 'reroof'). Additive; do not rely on a fixed vocabulary.","examples":[["pool"]]},"property_type":{"type":"string","title":"Property Type","description":"RESIDENTIAL, COMMERCIAL, INDUSTRIAL, MIXED_USE or UNKNOWN. UNKNOWN is common -- many feeds publish nothing that implies a property type.","examples":["RESIDENTIAL"]},"address_street":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Address Street","description":"Street address as published. Stored verbatim, so spacing can be irregular; our address matching normalises whitespace for you.","examples":["288 Mosaic Blvd"]},"address_city":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Address City","description":"City. Null where the feed publishes none -- notably county-wide feeds. Read null as unknown, never as 'not in a city'.","examples":["Daytona Beach"]},"address_state":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Address State","description":"2-letter state. Null on 6.6M permits (7.3%) whose feed never populates it; those rows are still returned by ?state= searches, which admit them on independent evidence of the jurisdiction.","examples":["FL"]},"address_zip":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Address Zip","description":"5-digit ZIP where published.","examples":["32124"]},"parcel_id":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Parcel Id","description":"Assessor parcel number / APN exactly as the SOURCE publishes it -- formatting varies by county and is not normalised. ~41% populated estate-wide and entirely dependent on whether the source publishes one, so read a null as 'this feed does not carry a parcel', never as 'this property has none'. Filterable via ?parcel=.","examples":["521804000160"]},"description_raw":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Description Raw","description":"The scope of work exactly as the jurisdiction published it. The single most useful field for lead qualification, and the input our category classifier reads.","examples":["RE-ROOF: remove existing shingles, install 39 sq architectural shingles"]},"estimated_value":{"anyOf":[{"type":"number"},{"type":"null"}],"title":"Estimated Value","description":"Declared job value in USD, as published. Frequently null and occasionally nominal -- treat 0 and 1 as 'not stated'.","examples":[24500.0]},"date_filed":{"anyOf":[{"type":"string","format":"date"},{"type":"null"}],"title":"Date Filed","description":"Application/filing date. Null where the source publishes only an issue date.","examples":["2026-08-14"]},"date_issued":{"anyOf":[{"type":"string","format":"date"},{"type":"null"}],"title":"Date Issued","description":"Issue date. Null on ~25% of permits estate-wide -- whole feeds publish only a filed date -- which is why date_after/date_before filter on COALESCE(date_issued, date_filed) and issued_after does not.","examples":["2026-08-21"]},"date_completed":{"anyOf":[{"type":"string","format":"date"},{"type":"null"}],"title":"Date Completed","description":"Completion/final date where the source publishes one. Usually null.","examples":[null]},"approval_days":{"anyOf":[{"type":"integer"},{"type":"null"}],"title":"Approval Days","description":"Calendar days from date_