":["Metrics","Metrics"],"summary":"Metrics Monthly","description":"Monthly permit counts and total valuation for a city/state/category.\n\nAvailable on the Developer plan and above (see /v1/billing/plans for current pricing).\n\nServed from a nightly rollup, so it answers in milliseconds where the equivalent\nsearch-and-count takes seconds. At least one of `state` or `city` is required: an\nunfiltered national series would be a different (and much larger) product.","operationId":"metrics_monthly","security":[{"ApiKey":[]}],"parameters":[{"name":"state","in":"query","required":false,"schema":{"anyOf":[{"type":"string","minLength":2,"maxLength":2},{"type":"null"}],"description":"Two-letter state code, e.g. FL","title":"State"},"description":"Two-letter state code, e.g. FL"},{"name":"city","in":"query","required":false,"schema":{"anyOf":[{"type":"string"},{"type":"null"}],"description":"City name; case-insensitive","title":"City"},"description":"City name; case-insensitive"},{"name":"category","in":"query","required":false,"schema":{"anyOf":[{"type":"string"},{"type":"null"}],"description":"Permit category, e.g. ROOFING","title":"Category"},"description":"Permit category, e.g. ROOFING"},{"name":"months","in":"query","required":false,"schema":{"type":"integer","maximum":120,"minimum":1,"description":"How many trailing months to return","default":24,"title":"Months"},"description":"How many trailing months to return"}],"responses":{"200":{"description":"Successful Response","content":{"application/json":{"schema":{}}}},"422":{"description":"Validation Error","content":{"application/json":{"schema":{"$ref":"#/components/schemas/HTTPValidationError"}}}},"401":{"description":"Missing or invalid API key. Pass a key as the `X-API-Key` header.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorDetail"},"example":{"detail":"Invalid API key"}}}},"429":{"description":"Rate limit exceeded -- either the per-minute burst or the daily cap for your plan. Retry after the window resets; the daily cap resets at UTC midnight.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorDetail"},"example":{"detail":"Rate limit exceeded: 30 requests per minute"}}}},"403":{"description":"Your plan does not include this endpoint, or an option you passed. The body is machine-readable: `error` is `feature_locked`, `feature` names the gate, `upgrade_url` links to the cheapest plan that unlocks it, and `current_tier` is the plan you are on.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/FeatureLocked"},"example":{"detail":{"error":"feature_locked","feature":"full_fields","message":"fields=full is available on Developer ($79/mo) and above.","upgrade_url":"https://permit-stack.com/?plan=developer&feature=full_fields#pricing","current_tier":"Indie"}}}}}}}},"/v1/metrics/current":{"get":{"tags":["Metrics","Metrics"],"summary":"Metrics Current","description":"Category breakdown over a trailing window — the 'what is happening here now' view.\n\nAvailable on the Developer plan and above (see /v1/billing/plans for current pricing).","operationId":"metrics_current","security":[{"ApiKey":[]}],"parameters":[{"name":"state","in":"query","required":false,"schema":{"anyOf":[{"type":"string","minLength":2,"maxLength":2},{"type":"null"}],"title":"State"}},{"name":"city","in":"query","required":false,"schema":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"City"}},{"name":"days","in":"query","required":false,"schema":{"type":"integer","maximum":730,"minimum":28,"description":"Trailing window. Rounded to whole months by the rollup.","default":90,"title":"Days"},"description":"Trailing window. Rounded to whole months by the rollup."}],"responses":{"200":{"description":"Successful Response","content":{"application/json":{"schema":{}}}},"422":{"description":"Validation Error","content":{"application/json":{"schema":{"$ref":"#/components/schemas/HTTPValidationError"}}}},"401":{"description":"Missing or invalid API key. Pass a key as the `X-API-Key` header.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorDetail"},"example":{"detail":"Invalid API key"}}}},"429":{"description":"Rate limit exceeded -- either the per-minute burst or the daily cap for your plan. Retry after the window resets; the daily cap resets at UTC midnight.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorDetail"},"example":{"detail":"Rate limit exceeded: 30 requests per minute"}}}},"403":{"description":"Your plan does not include this endpoint, or an option you passed. The body is machine-readable: `error` is `feature_locked`, `feature` names the gate, `upgrade_url` links to the cheapest plan that unlocks it, and `current_tier` is the plan you are on.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/FeatureLocked"},"example":{"detail":{"error":"feature_locked","feature":"full_fields","message":"fields=full is available on Developer ($79/mo) and above.","upgrade_url":"https://permit-stack.com/?plan=developer&feature=full_fields#pricing","current_tier":"Indie"}}}}}}}},"/v1/metrics/cities":{"get":{"tags":["Metrics","Metrics"],"summary":"Metrics Cities","description":"Busiest cities in a state — the ranking customers were building by hand.\n\nAvailable on the Developer plan and above (see /v1/billing/plans for current pricing).","operationId":"metrics_cities","security":[{"ApiKey":[]}],"parameters":[{"name":"state","in":"query","required":true,"schema":{"type":"string","minLength":2,"maxLength":2,"title":"State"}},{"name":"category","in":"query","required":false,"schema":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Category"}},{"name":"months","in":"query","required":false,"schema":{"type":"integer","maximum":120,"minimum":1,"default":12,"title":"Months"}},{"name":"limit","in":"query","required":false,"schema":{"type":"integer","maximum":500,"minimum":1,"default":50,"title":"Limit"}}],"responses":{"200":{"description":"Successful Response","content":{"application/json":{"schema":{}}}},"422":{"description":"Validation Error","content":{"application/json":{"schema":{"$ref":"#/components/schemas/HTTPValidationError"}}}},"401":{"description":"Missing or invalid API key. Pass a key as the `X-API-Key` header.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorDetail"},"example":{"detail":"Invalid API key"}}}},"429":{"description":"Rate limit exceeded -- either the per-minute burst or the daily cap for your plan. Retry after the window resets; the daily cap resets at UTC midnight.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorDetail"},"example":{"detail":"Rate limit exceeded: 30 requests per minute"}}}},"403":{"description":"Your plan does not include this endpoint, or an option you passed. The body is machine-readable: `error` is `feature_locked`, `feature` names the gate, `upgrade_url` links to the cheapest plan that unlocks it, and `current_tier` is the plan you are on.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/FeatureLocked"},"example":{"detail":{"error":"feature_locked","feature":"full_fields","message":"fields=full is available on Developer ($79/mo) and above.","upgrade_url":"https://permit-stack.com/?plan=developer&feature=full_fields#pricing","current_tier":"Indie"}}}}}}}}},"components":{"securitySchemes":{"ApiKey":{"type":"apiKey","description":"Your PermitStack API key. Get one at permit-stack.com/#pricing","in":"header","name":"X-API-Key"}},"schemas":{"ContractorProfile":{"properties":{"id":{"type":"string","format":"uuid","title":"Id"},"name":{"type":"string","title":"Name"},"license_number":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"License Number"},"license_state":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"License State"},"city":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"City"},"state":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"State"},"total_permits":{"type":"integer","title":"Total Permits"},"first_permit_date":{"anyOf":[{"type":"string","format":"date"},{"type":"null"}],"title":"First Permit Date"},"last_permit_date":{"anyOf":[{"type":"string","format":"date"},{"type":"null"}],"title":"Last Permit Date"},"specialties":{"anyOf":[{"items":{"type":"string"},"type":"array"},{"type":"null"}],"title":"Specialties"},"score":{"anyOf":[{"type":"integer"},{"type":"null"}],"title":"Score"},"is_business":{"anyOf":[{"type":"boolean"},{"type":"null"}],"title":"Is Business"},"phone":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Phone"},"email":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Email"},"contact_locked":{"anyOf":[{"type":"boolean"},{"type":"null"}],"title":"Contact Locked"},"locked_fields":{"anyOf":[{"items":{"type":"string"},"type":"array"},{"type":"null"}],"title":"Locked Fields"},"upgrade_url":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Upgrade Url"},"address":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Address"},"zip_code":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Zip Code"},"recent_categories":{"anyOf":[{"items":{"type":"string"},"type":"array"},{"type":"null"}],"title":"Recent Categories"},"avg_project_value":{"anyOf":[{"type":"number"},{"type":"null"}],"title":"Avg Project Value"}},"type":"object","required":["id","name","license_number","license_state","city","state","total_permits","first_permit_date","last_permit_date","specialties","phone","email","address","zip_code"],"title":"ContractorProfile"},"ContractorSearchResponse":{"properties":{"total":{"type":"integer","title":"Total"},"page":{"type":"integer","title":"Page"},"per_page":{"type":"integer","title":"Per Page"},"results":{"items":{"$ref":"#/components/schemas/ContractorSummary"},"type":"array","title":"Results"},"specialties_matched":{"anyOf":[{"items":{"type":"string"},"type":"array"},{"type":"null"}],"title":"Specialties Matched"}},"type":"object","required":["total","page","per_page","results"],"title":"ContractorSearchResponse"},"ContractorSummary":{"properties":{"id":{"type":"string","format":"uuid","title":"Id"},"name":{"type":"string","title":"Name"},"license_number":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"License Number"},"license_state":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"License State"},"city":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"City"},"state":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"State"},"total_permits":{"type":"integer","title":"Total Permits"},"first_permit_date":{"anyOf":[{"type":"string","format":"date"},{"type":"null"}],"title":"First Permit Date"},"last_permit_date":{"anyOf":[{"type":"string","format":"date"},{"type":"null"}],"title":"Last Permit Date"},"specialties":{"anyOf":[{"items":{"type":"string"},"type":"array"},{"type":"null"}],"title":"Specialties"},"score":{"anyOf":[{"type":"integer"},{"type":"null"}],"title":"Score"},"is_business":{"anyOf":[{"type":"boolean"},{"type":"null"}],"title":"Is Business"}},"type":"object","required":["id","name","license_number","license_state","city","state","total_permits","first_permit_date","last_permit_date","specialties"],"title":"ContractorSummary"},"CoverageConfidence":{"properties":{"confidence":{"type":"string","title":"Confidence"},"covered":{"type":"boolean","title":"Covered"},"jurisdiction":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Jurisdiction"},"data_status":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Data Status"},"data_through":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Data Through"},"freshness":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Freshness"},"jurisdiction_permit_count":{"anyOf":[{"type":"integer"},{"type":"null"}],"title":"Jurisdiction Permit Count"},"note":{"type":"string","title":"Note"},"tier_window_days":{"anyOf":[{"type":"integer"},{"type":"null"}],"title":"Tier Window Days"},"tier_window_from":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Tier Window From"}},"type":"object","required":["confidence","covered","note"],"title":"CoverageConfidence","description":"Honest read on whether a `found: false` is meaningful or just missing data.\n\nThe wedge competitors won't ship: a 'no permit on record' is only useful if we\nactually cover that jurisdiction. We say so explicitly so an automated (e.g.\nunderwriting) workflow can tell UNKNOWN apart from genuinely-no-work."},"HTTPValidationError":{"properties":{"detail":{"items":{"$ref":"#/components/schemas/ValidationError"},"type":"array","title":"Detail"}},"type":"object","title":"HTTPValidationError"},"Hint":{"properties":{"code":{"type":"string","title":"Code"},"message":{"type":"string","title":"Message"},"docs_url":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Docs Url"}},"type":"object","required":["code","message"],"title":"Hint","description":"Advisory, additive, never an error. Tells a caller that a cheaper endpoint answers\nthe question their request pattern implies."},"JurisdictionCoverage":{"properties":{"jurisdiction":{"type":"string","title":"Jurisdiction"},"data_through":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Data Through"},"status":{"type":"string","title":"Status","default":"not_measured"},"results_on_page":{"type":"integer","title":"Results On Page","default":0},"with_contractor":{"type":"integer","title":"With Contractor","default":0}},"type":"object","required":["jurisdiction"],"title":"JurisdictionCoverage","description":"How current one jurisdiction's data is, for the jurisdictions on THIS page of results.\n\nLets you tell \"this source has not yet published the window you asked about\" apart from\n\"this data is missing\": `data_through` is the newest permit we hold for the jurisdiction,\nand `with_contractor` shows how many rows on this page carry a contractor name."},"PermitDetail":{"properties":{"id":{"type":"string","format":"uuid","title":"Id","description":"Stable PermitStack id. Pass to GET /v1/permits/{id}.","examples":["f4be62ed-b522-42a3-907b-b4ab4ec1a102"]},"permit_number":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Permit Number","description":"The permit number as the issuing jurisdiction publishes it. Not unique across jurisdictions, and not always present.","examples":["R2608-181"]},"status":{"type":"string","enum":["FILED","ISSUED","IN_PROGRESS","FINAL","EXPIRED","CANCELLED","REVOKED","UNKNOWN","INTERCONNECTED"],"title":"Status","description":"One of FILED, ISSUED, IN_PROGRESS, FINAL, EXPIRED, CANCELLED, REVOKED, INTERCONNECTED, UNKNOWN -- normalised by us from each source's own vocabulary. UNKNOWN means the source published no status, never that the permit is inactive. INTERCONNECTED comes from the California NEM solar feed.","examples":["ISSUED"]},"category":{"type":"string","enum":["NEW_CONSTRUCTION","RENOVATION","DEMOLITION","ELECTRICAL","PLUMBING","MECHANICAL","ROOFING","SOLAR","BATTERY","EV_CHARGER","HVAC","FIRE_ALARM","SIGN","FENCE","POOL","FOUNDATION","ADDITION","INTERIOR_REMODEL","GRADING","OTHER"],"title":"Category","description":"Trade/work classification, UPPERCASE. One of: NEW_CONSTRUCTION, RENOVATION, DEMOLITION, ELECTRICAL, PLUMBING, MECHANICAL, ROOFING, SOLAR, BATTERY, EV_CHARGER, HVAC, FIRE_ALARM, SIGN, FENCE, POOL, FOUNDATION, ADDITION, INTERIOR_REMODEL, GRADING, OTHER. Derived by us from the permit type and description, not published by the city. NOTE when FILTERING: ?category=hvac matches HVAC *and* MECHANICAL, and ?category=mechanical does the same, because HVAC work is routinely filed as MECHANICAL -- they are one market and a bare equality would hide half of it.","examples":["ROOFING"]},"tags":{"anyOf":[{"items":{"type":"string"},"type":"array"},{"type":"null"}],"title":"Tags","description":"Free-form keywords extracted from the description (e.g. 'pool', 'reroof'). Additive; do not rely on a fixed vocabulary.","examples":[["pool"]]},"property_type":{"type":"string","title":"Property Type","description":"RESIDENTIAL, COMMERCIAL, INDUSTRIAL, MIXED_USE or UNKNOWN. UNKNOWN is common -- many feeds publish nothing that implies a property type.","examples":["RESIDENTIAL"]},"address_street":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Address Street","description":"Street address as published. Stored verbatim, so spacing can be irregular; our address matching normalises whitespace for you.","examples":["288 Mosaic Blvd"]},"address_city":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Address City","description":"City. Null where the feed publishes none -- notably county-wide feeds. Read null as unknown, never as 'not in a city'.","examples":["Daytona Beach"]},"address_state":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Address State","description":"2-letter state. Null on 6.6M permits (7.3%) whose feed never populates it; those rows are still returned by ?state= searches, which admit them on independent evidence of the jurisdiction.","examples":["FL"]},"address_zip":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Address Zip","description":"5-digit ZIP where published.","examples":["32124"]},"parcel_id":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Parcel Id","description":"Assessor parcel number / APN exactly as the SOURCE publishes it -- formatting varies by county and is not normalised. ~41% populated estate-wide and entirely dependent on whether the source publishes one, so read a null as 'this feed does not carry a parcel', never as 'this property has none'. Filterable via ?parcel=.","examples":["521804000160"]},"description_raw":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Description Raw","description":"The scope of work exactly as the jurisdiction published it. The single most useful field for lead qualification, and the input our category classifier reads.","examples":["RE-ROOF: remove existing shingles, install 39 sq architectural shingles"]},"estimated_value":{"anyOf":[{"type":"number"},{"type":"null"}],"title":"Estimated Value","description":"Declared job value in USD, as published. Frequently null and occasionally nominal -- treat 0 and 1 as 'not stated'.","examples":[24500.0]},"date_filed":{"anyOf":[{"type":"string","format":"date"},{"type":"null"}],"title":"Date Filed","description":"Application/filing date. Null where the source publishes only an issue date.","examples":["2026-08-14"]},"date_issued":{"anyOf":[{"type":"string","format":"date"},{"type":"null"}],"title":"Date Issued","description":"Issue date. Null on ~25% of permits estate-wide -- whole feeds publish only a filed date -- which is why date_after/date_before filter on COALESCE(date_issued, date_filed) and issued_after does not.","examples":["2026-08-21"]},"date_completed":{"anyOf":[{"type":"string","format":"date"},{"type":"null"}],"title":"Date Completed","description":"Completion/final date where the source publishes one. Usually null.","examples":[null]},"approval_days":{"anyOf":[{"type":"integer"},{"type":"null"}],"title":"Approval Days","description":"Calendar days from date_filed to date_issued (null unless both dates present)"},"construction_days":{"anyOf":[{"type":"integer"},{"type":"null"}],"title":"Construction Days","description":"Calendar days from date_issued to date_completed (null unless both dates present)"},"contractor_name":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Contractor Name","description":"Contractor of record, cleaned and de-duplicated by us. Null where the feed publishes no contractor -- which is whole jurisdictions, not scattered rows: 45% of permits estate-wide carry one. A page of nulls usually means the source does not publish contractors, not that our data is missing; the `jurisdiction_coverage` block on a search response tells you which.","examples":["GLZ Industries LLC"]},"contractor_id":{"anyOf":[{"type":"string","format":"uuid"},{"type":"null"}],"title":"Contractor Id","description":"Opaque id of the contractor on this permit. Pass it to GET /v1/contractors/{id} for the full record; null when the source publishes no contractor for this permit."},"owner_name":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Owner Name","description":"Owner of record. contractor_name null + owner_name set means no contractor was recorded -- often a homeowner who pulled the permit themselves, which is a sales lead. Caveat: on feeds that capture no contractor at all, EVERY permit looks owner-filed and the owner may be a builder, not a homeowner. Use the ?owner_filed= filter rather than inferring this yourself.","examples":["SMITH JOHN A"]},"owner_address":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Owner Address","description":"Property-owner MAILING address. Business plan ($149/mo) and above; null on every other plan, which is a gate and not an absence of data. Joined from county assessor rolls by parcel, so coverage is bimodal -- near-complete in the jurisdictions whose roll we have loaded, absent in those we have not. Never read a null as 'this property has no owner on record'.","examples":[null]},"jurisdiction_name":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Jurisdiction Name","description":"The PermitStack data source this permit came from -- a city, county or statewide feed, which is not always the permit's own city.","examples":["Daytona Beach"]},"latitude":{"anyOf":[{"type":"number"},{"type":"null"}],"title":"Latitude","description":"WGS84 latitude. Null where the source publishes no coordinates and we could not geocode it; such permits are invisible to radius, bbox and polygon search.","examples":[29.1872]},"longitude":{"anyOf":[{"type":"number"},{"type":"null"}],"title":"Longitude","description":"WGS84 longitude.","examples":[-81.0559]},"location_source":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Location Source","description":"Where the coordinates came from. 'source' = published by the city with the permit record, as good as the city's own data. 'geocoded' = derived by us from the site address (TIGER, address-centroid quality), which for a structure set back from the road, such as an antenna mast, marks the property address rather than the structure. 'derived' = set by us by another method (typically a parcel-centroid join), so treat it as ours, not the city's. 'source' is judged per feed: in a feed that publishes coordinates, a minority of rows whose record lacked them may have been filled by our geocoder before 2026-09-21, when it began logging successes, and those read 'source'. Null when latitude/longitude are null.","examples":["source"]},"enrichment":{"anyOf":[{"$ref":"#/components/schemas/PermitEnrichment"},{"type":"null"}],"description":"Structured detail parsed from the description (e.g. solar kW) where we could extract it. Null for most permits."},"record_kind":{"type":"string","title":"Record Kind","description":"permit | contractor | tag | non_building | admin. Some portals mix non-permit records (contractor registrations, right-of-way, administrative) into the same feed; we store them and label them rather than counting them as permits. Search and export return record_kind='permit' only unless you ask otherwise.","default":"permit","examples":["permit"]},"date_expired":{"anyOf":[{"type":"string","format":"date"},{"type":"null"}],"title":"Date Expired","description":"Expiry date where published. Deliberately NOT null-checked against the future the way the other dates are -- an expiry legitimately lies ahead.","examples":["2027-02-21"]},"fee_amount":{"anyOf":[{"type":"number"},{"type":"null"}],"title":"Fee Amount","description":"Permit/inspection fee. Frequently null — most open-data feeds do not publish fee data."},"stories":{"anyOf":[{"type":"integer"},{"type":"null"}],"title":"Stories","description":"Building stories, where published.","examples":[1]},"units":{"anyOf":[{"type":"integer"},{"type":"null"}],"title":"Units","description":"Dwelling/tenant units, where published.","examples":[1]},"square_footage":{"anyOf":[{"type":"number"},{"type":"null"}],"title":"Square Footage","description":"Project square footage, where published. Usually null.","examples":[2100.0]},"applicant_name":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Applicant Name","description":"Whoever filed the application. On most feeds this is the OWNER; on a few it is the contractor, and for those tenants we map it to contractor_name instead. Never assume which one it is from this field alone.","examples":["WINDOW WORLD OF DAYTONA"]},"contractor_license":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Contractor License","description":"Contractor's licence number as published or as matched against a state licence-board roster. A free public identifier; contact details remain gated to /v1/contractors/{id} on Developer+.","examples":["CBC1262595"]},"created_at":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Created At","description":"When PermitStack first ingested this record (ISO 8601). NOT a date the city published -- use date_filed/date_issued for that.","examples":["2026-08-22T04:11:03.882174+00:00"]}},"type":"object","required":["id","permit_number","status","category","tags","property_type","address_street","address_city","address_state","address_zip","description_raw","estimated_value","date_filed","date_issued","date_completed","date_expired","stories","units","square_footage","applicant_name"],"title":"PermitDetail","description":"PermitSummary plus the nine columns that only a single-permit lookup used to carry.\nAlso returned inline by search and sync with ?fields=full (Developer and above)."},"PermitEnrichment":{"properties":{"scope":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Scope"},"work_summary":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Work Summary"},"solar_kw":{"anyOf":[{"type":"number"},{"type":"null"}],"title":"Solar Kw"},"sqft":{"anyOf":[{"type":"number"},{"type":"null"}],"title":"Sqft"},"units":{"anyOf":[{"type":"integer"},{"type":"null"}],"title":"Units"},"is_residential":{"anyOf":[{"type":"boolean"},{"type":"null"}